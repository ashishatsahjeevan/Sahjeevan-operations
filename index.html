<html lang="en">

<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* ============================================================
   SAHJEEVAN OPERATIONS
   Palette grounded in Kachchh/Banni: Ajrakh indigo, grassland
   green, salt/sand neutrals, madder red used sparingly.
   ============================================================ */
:root{
  --indigo:#1d2b50;--indigo-700:#2a3d6e;--indigo-500:#3c558f;
  --grass:#4f7d3f;--grass-soft:#e8f0e2;
  --madder:#a23b24;--madder-soft:#f6e6e0;
  --amber:#c8861a;--amber-soft:#f8eed8;
  --sand:#f3efe6;--bone:#fbf9f4;
  --ink:#222630;--ink-soft:#5a6072;
  --line:#e2ddd0;--line-strong:#cfc8b6;--white:#ffffff;
  --radius:12px;--radius-sm:8px;
  --shadow:0 1px 2px rgba(29,43,80,.06),0 8px 24px rgba(29,43,80,.06);
  --shadow-lg:0 12px 40px rgba(29,43,80,.16);
  --font:"Hanken Grotesk","Noto Sans Devanagari","Noto Sans Gujarati",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--sand);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45}
:lang(hi),:lang(gu){font-weight:400}
button{font-family:inherit;cursor:pointer}
a{color:var(--indigo-500)}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:4px}

.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{background:var(--bone);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);max-width:440px;width:100%;overflow:hidden}
.login-head{background:var(--indigo);color:#fff;padding:30px 30px 26px;position:relative}
.login-head .mark{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.login-head .mark .glyph{width:58px;height:58px;flex:none}
.login-head h1{font-size:21px;letter-spacing:-.02em}
.login-head p{margin:4px 0 0;color:#b9c4dd;font-size:13.5px}
.weave{height:8px;background:repeating-linear-gradient(135deg,var(--grass) 0 9px,var(--amber) 9px 18px,var(--madder) 18px 27px,var(--indigo-500) 27px 36px)}
.login-body{padding:24px 30px 30px}
.login-body label{font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.login-hint{margin:8px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.5}
.login-status{margin-top:16px;font-size:13px;line-height:1.5;text-align:center}
.login-status.err{color:var(--madder)}
.login-status.busy{color:var(--ink-soft)}
.login-setup{margin-top:16px;font-size:12.5px;color:var(--ink-soft);background:var(--amber-soft);border:1px solid #ecd9a8;border-radius:10px;padding:12px 13px;line-height:1.55;text-align:left}
.login-setup b{color:var(--ink)}
.login-setup code{background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11.5px}


.app{display:none;min-height:calc(100vh - 33px)}
.app.on{display:grid;grid-template-columns:230px 1fr}
.sidebar{background:var(--indigo);color:#cdd6ea;display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 33px)}
.brand{padding:16px 16px 14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .glyph{width:46px;height:46px;flex:none}
/* The logo is a dark-brown wordmark, so it needs a light tile to sit on
   against the indigo chrome. */
.glyph.has-logo{background:#fff;border-radius:9px;padding:4px;box-sizing:border-box;
  box-shadow:0 1px 3px rgba(0,0,0,.18)}
.login-head .mark .glyph.has-logo{border-radius:11px;padding:5px}
.brand b{color:#fff;font-size:16px;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;color:#8c9bc0;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1}
.nav .grp{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6f7ea6;padding:12px 12px 5px}
.nav button{background:transparent;border:0;color:#cdd6ea;text-align:left;padding:9px 12px;border-radius:9px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:11px;width:100%;transition:background .12s,color .12s}
.nav button .ic{width:18px;height:18px;flex:none;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.active{background:var(--bone);color:var(--indigo);font-weight:700}
.nav button.active .ic{opacity:1}
.side-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.side-foot .who{font-size:13px;color:#fff;font-weight:600}
.side-foot .who small{display:block;color:#8c9bc0;font-weight:500;font-size:11.5px}
.side-foot button{margin-top:9px;width:100%;background:rgba(255,255,255,.08);border:0;color:#dfe6f5;padding:8px;border-radius:8px;font-size:12.5px;font-weight:600}
.side-foot button:hover{background:rgba(255,255,255,.16)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--bone);border-bottom:1px solid var(--line);padding:13px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.topbar h2{font-size:17px;flex:1;min-width:0}
.topbar h2 span{display:block;font-size:12px;color:var(--ink-soft);font-weight:500}
.lang{display:flex;background:#fff;border:1px solid var(--line-strong);border-radius:999px;padding:2px;gap:2px}
.lang button{border:0;background:transparent;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.lang button.on{background:var(--indigo);color:#fff}
.content{padding:22px;max-width:1180px;width:100%;margin:0 auto}
.loading-shell{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:14px;padding:40px 0}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--indigo-500);animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

.mobnav{display:none}.hamb{display:none}

.card{background:var(--bone);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.field .req{color:var(--madder)}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:9px;padding:10px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--indigo-500);box-shadow:0 0 0 3px rgba(60,85,143,.14)}
textarea{resize:vertical;min-height:64px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:700;background:var(--indigo);color:#fff;display:inline-flex;align-items:center;gap:8px;transition:transform .1s,filter .12s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:#fff;color:var(--indigo);border:1px solid var(--line-strong)}
.btn.grass{background:var(--grass)}.btn.madder{background:var(--madder)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.pagehead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h3{font-size:19px}
.pagehead p{margin:3px 0 0;color:var(--ink-soft);font-size:13.5px}
.pagehead .sp{flex:1}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.draft{background:#eceae3;color:#7a7565}
.pill.pending{background:var(--amber-soft);color:#9a6712}
.pill.approved{background:var(--grass-soft);color:#3a5e2e}
.pill.rejected{background:var(--madder-soft);color:#82301c}
.pill.booked{background:#e2e9f7;color:#2a3d6e}
.pill.progress{background:#e0eef0;color:#1c6470}
.pill.completed{background:#e7e4ee;color:#4b3d6e}
.pill.issued{background:var(--amber-soft);color:#9a6712}
.pill.returned{background:var(--grass-soft);color:#3a5e2e}
.pill.overdue{background:var(--madder-soft);color:#82301c}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--bone)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;padding:11px 13px;border-bottom:1px solid var(--line);background:#f7f4ec}
td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr:hover td{background:#faf8f2}
.muted{color:var(--ink-soft)}
.kvs{display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.kvs div{display:flex;gap:8px}
.kvs span{color:var(--ink-soft);min-width:140px;font-weight:600;font-size:12.5px}

.stat{display:flex;flex-direction:column;gap:2px;background:var(--bone);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--ink-soft);font-weight:600}
.stat.g .n{color:var(--grass)}.stat.a .n{color:var(--amber)}.stat.i .n{color:var(--indigo)}.stat.m .n{color:var(--madder)}

.notice{border-radius:var(--radius);padding:13px 15px;font-size:13.5px;display:flex;gap:11px;align-items:flex-start;line-height:1.5}
.notice svg{width:18px;height:18px;flex:none;margin-top:1px}
.notice.info{background:#e9eefb;color:#2a3d6e;border:1px solid #cdd9f3}
.notice.warn{background:var(--amber-soft);color:#7d5510;border:1px solid #ecd9a8}
.notice.privacy{background:var(--grass-soft);color:#33502a;border:1px solid #c6dcb8}
.notice.ok{background:var(--grass-soft);color:#33502a;border:1px solid #c6dcb8}
/* Section header inside a tab, with room for export buttons on the right */
.vw-head{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.vw-head h3{font-size:14px;font-weight:700;color:var(--ink);margin:0}
/* Right-aligned figures with even digit widths, so km columns line up */
td.rt,th.rt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tfoot td{border-top:2px solid var(--line-strong);background:var(--sand)}

.minirow{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.minirow .idx{width:26px;height:26px;border-radius:7px;background:var(--indigo);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.minirow .x{background:#fff;border:1px solid var(--line-strong);color:var(--madder);border-radius:8px;padding:0;width:34px;height:38px;font-size:18px;line-height:1}
.travrow{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}

/* real map containers */
.modal-bg{position:fixed;inset:0;background:rgba(20,28,52,.5);display:none;place-items:center;z-index:1000;padding:18px}
.modal-bg.on{display:grid}
.modal{background:var(--bone);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal-head h3{flex:1;font-size:17px}
.modal-head .x{background:#fff;border:1px solid var(--line-strong);border-radius:8px;width:32px;height:32px;font-size:18px}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--indigo);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);z-index:2000;opacity:0;transition:transform .25s,opacity .25s;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.hide{display:none!important}

.confgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.taglist{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.tag{background:#fff;border:1px solid var(--line-strong);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;display:flex;gap:7px;align-items:center}
.tag button{border:0;background:transparent;color:var(--madder);font-size:15px;line-height:1;padding:0}

.pickreadout{display:flex;gap:14px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--ink-soft);flex-wrap:wrap}
.pickreadout b{color:var(--ink)}
.slip-preview{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;font-size:13px;color:#000}
.slip-preview h4{font-size:15px;border-bottom:2px solid #000;padding-bottom:6px;margin:0 0 10px}
.slip-preview .grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 18px;margin-bottom:10px;font-size:12.5px}
.slip-preview table{width:100%;border:1px solid #000;font-size:11.5px;border-collapse:collapse;margin-top:6px}
.slip-preview th,.slip-preview td{border:1px solid #000;padding:5px}
.field-card{display:flex;gap:12px;align-items:center;background:var(--bone);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow);min-width:230px}
.field-card .vic{width:38px;height:38px;border-radius:9px;background:var(--indigo);color:#fff;display:grid;place-items:center;flex:none}
.field-card .vic svg{width:20px;height:20px}
.field-card b{font-size:13.5px;display:block}
.field-card .sub{font-size:11.5px;color:var(--ink-soft)}

@media (max-width:860px){
  .app.on{grid-template-columns:1fr}
  .sidebar{display:none}
  .hamb{display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid var(--line-strong);background:#fff;border-radius:9px}
  .content{padding:16px 14px 90px}
  .grid2,.grid3,.confgrid{grid-template-columns:1fr}
  .minirow{grid-template-columns:24px 1fr auto;grid-auto-rows:auto}
  .mobnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bone);border-top:1px solid var(--line);z-index:60;padding:6px 6px env(safe-area-inset-bottom);justify-content:space-around}
  .mobnav button{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-soft);font-size:10.5px;font-weight:600;padding:6px 8px;border-radius:9px;flex:1}
  .mobnav button .ic{width:21px;height:21px}
  .mobnav button.active{color:var(--indigo);background:var(--grass-soft)}
  .drawer-bg{position:fixed;inset:0;background:rgba(20,28,52,.5);z-index:90;display:none}
  .drawer-bg.on{display:block}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:264px;background:var(--indigo);z-index:100;transform:translateX(-100%);transition:transform .22s;display:flex;flex-direction:column}
  .drawer.on{transform:none}
}
@media (min-width:861px){.drawer,.drawer-bg{display:none!important}}

/* ---- PRINT / PDF ------------------------------------------------------
   Two different things print through #printArea: a requisition SLIP (a
   one-page form, portrait, few columns) and a REPORT (a long table, often
   9-11 columns, which needs landscape and a repeating header). They share
   .slip; .slip.report adds only what the wide case needs.
   @page carries the paper size and margins — without it the browser's
   default margin box competes with the padding below and wide tables get
   clipped at the right edge. */
@page{size:A4 portrait;margin:12mm}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;inset:0;padding:0;background:#fff;display:block!important}
  /* Landscape is set per-document by exportPDF adding .landscape */
  #printArea.landscape{}
  /* Never leave a row orphaned from its header, and never split a row. */
  #printArea tr,#printArea img{page-break-inside:avoid;break-inside:avoid}
  #printArea thead{display:table-header-group}
  #printArea tfoot{display:table-footer-group}
  /* Backgrounds (header shading, zebra striping) are dropped by default in
     print; without this the header row is indistinguishable from the data. */
  #printArea *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#printArea{display:none}
.slip{max-width:720px;margin:0 auto;padding:28px;font-size:13px;color:#000;
      font-family:"Hanken Grotesk",system-ui,sans-serif}
.slip h2{font-size:18px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}
/* exportPDF emits an h4 title; it had no rule at all before, so report
   headings fell back to the browser's default h4 (smaller than the body
   text in some engines) while slip headings used h2. Both are styled now. */
.slip h4{font-size:16px;font-weight:700;border-bottom:2px solid #000;
         padding-bottom:6px;margin:0 0 6px}
.slip .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin-bottom:14px}
.slip .grid div{display:flex;gap:6px}
.slip .grid b{min-width:130px}
/* border-collapse was missing here (it was only ever set on the on-screen
   .slip-preview), so every cell drew its own 1px border and the table came
   out with doubled, misaligned rules. This is the main reason printed
   reports looked wrong. */
.slip table{width:100%;border-collapse:collapse;border:1px solid #000;font-size:12px}
.slip th,.slip td{border:1px solid #000;padding:6px;vertical-align:top;text-align:left}
.slip thead th{background:#e8e8e8;font-weight:700}
.slip .signs{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:40px}
.slip .signs div{border-top:1px solid #000;padding-top:6px;font-size:11px;text-align:center}

/* ---- wide multi-column report variant ---- */
.slip.report{max-width:none;padding:0}
.slip.report table{font-size:9.5px;table-layout:auto}
.slip.report th,.slip.report td{padding:3px 5px;word-break:break-word;
  overflow-wrap:anywhere;hyphens:auto}
/* Zebra striping keeps the eye on the right row across a wide table. */
.slip.report tbody tr:nth-child(even){background:#f4f4f4}
/* Numeric columns read far better right-aligned and non-wrapping;
   exportPDF tags them automatically (see isNumericCol). */
.slip.report td.num,.slip.report th.num{text-align:right;white-space:nowrap;
  font-variant-numeric:tabular-nums}
/* Dates shouldn't wrap mid-value either. */
.slip.report td.nowrap,.slip.report th.nowrap{white-space:nowrap}
.slip .repmeta{font-size:10.5px;margin-bottom:8px;color:#333}
.slip .repfoot{font-size:9.5px;margin-top:10px;color:#333;
  border-top:1px solid #999;padding-top:5px}
/* ===== Production additions ===== */
.routechips{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 10px}
.routechips button{background:#fff;border:1px solid var(--line-strong);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--indigo)}
.routechips button:hover{border-color:var(--indigo-500);background:#fbfcff}
.seg{display:flex;background:#fff;border:1px solid var(--line-strong);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.seg button.on{background:var(--indigo);color:#fff}
.vendorbox{background:var(--amber-soft);border:1px solid #ecd9a8;border-radius:var(--radius);padding:13px 15px;margin-top:10px}

<script>
/* ============================================================
   1) CONFIG — INTEGRATION POINTS
   ============================================================ */
const CONFIG = {
  USE_LIVE_BACKEND: true,                 // set true after you deploy Apps Script
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbw6ziU6asxuI4uwXQHPBTcIq_Ea6mzcK4mgdSIe9kfs_lqUpRisVrEXqLnkjUhkO6u7/exec",
  GOOGLE_CLIENT_ID: "669297478883-1b0vl1qjkbm9vbdino0nsub6mukvu262.apps.googleusercontent.com",
  ALLOWED_DOMAIN: "sahjeevan.org"
};

/* Single secure gateway. In live mode every read/write + every email
   goes through the Apps Script Web App (which is the only thing that can
   write the Sheet and the only thing that can send mail). */
async function api(action, payload){
  if(WRITE_ACTIONS.includes(action)){ clearReadCache(); clearSnapshot(); }
  if(CONFIG.USE_LIVE_BACKEND){
    try{
      const controller = new AbortController();
      const timer = setTimeout(()=>controller.abort(), 20000); // 20s safety timeout
      const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify({action, payload, token: AUTH.credential || AUTH.idToken}),
        redirect:"follow",
        signal: controller.signal
      });
      clearTimeout(timer);
      const text = await res.text();
      console.log("[api]", action, "→ status", res.status, "| first 80 chars:", text.slice(0,80));
      // Apps Script returns an HTML login page if not authorised — detect that
      if(text.trim().startsWith("<")){
        return {ok:false, error:"AUTH_HTML"};
      }
      let parsed;
      try{ parsed = JSON.parse(text); }
      catch(e){ console.warn("[api] JSON parse failed for", action, text.slice(0,200)); return {ok:false, error:"BAD_JSON"}; }
      if(parsed && parsed.error === "AUTH") console.warn("[auth]", parsed.reason || "(no reason given)");
      // Google sign-in tokens last about an hour. When one expires the
      // backend rejects it, so ask the person to sign in again rather than
      // letting every screen fail silently.
      // Only warn about expiry once someone is actually signed in — during
      // sign-in the caller shows its own message.
      if(parsed && parsed.error === "AUTH" && AUTH.user) sessionExpired();
      return parsed;
    }catch(err){
      console.warn("[api] fetch failed for", action, err.name, err.message);
      return {ok:false, error: err.name==="AbortError" ? "TIMEOUT" : "NETWORK"};
    }
  }
  throw new Error(t("err_backend_cfg"));
}

/* Safe list fetch — returns the array, or throws a clean error the
   render() catch turns into a helpful on-screen message. */
/* ---- read cache -------------------------------------------------------
   Apps Script takes roughly a second per call, so re-fetching the whole
   request list on every screen made the app feel sluggish. Reads are held
   briefly and dropped the moment anything is written. */
const READ_CACHE = new Map();
const CACHE_MS = 45000;
/* Anything that changes data must appear here, or the read cache will keep
   serving the old figures — a stale leave balance right after recording a
   late mark is exactly the kind of thing nobody would think to question. */
const WRITE_ACTIONS = ["createRequest","editRequest","cancelRequest","decideRequest","escalateRequest",
  "bookVehicle","startTrip","closeTrip","issueAsset","requestReturn","validateAsset",
  "createLeave","decideLeave","setLogo",
  "createCompOff","decideCompOff","addLateMarks","removeLateMark",
  "saveTripDay","deleteTripDay"];
function clearReadCache(){ READ_CACHE.clear(); }

function sessionExpired(){
  if(window.__sessionWarned) return;
  window.__sessionWarned = true;
  openModal(t("sess_out"),
    `<p style="margin:0 0 10px">${t("sess_msg")}</p>
     <p class="muted" style="margin:0;font-size:13px">${t("sess_ok")}</p>`,
    `<button class="btn" onclick="location.reload()">${t("sess_btn")}</button>`);
}

async function apiData(action, payload, raw){
  /* Most list actions are already contained in the snapshot, so serve them
     from there rather than making another round trip. `raw` fetches the
     snapshot itself and must bypass this, or it would recurse. */
  if(!raw && SNAP_MAP[action]){
    try{
      const snap = await getSnapshot();
      if(snap && snap[SNAP_MAP[action]] !== undefined) return snap[SNAP_MAP[action]];
    }catch(e){ /* fall through to a direct call */ }
  }
  /* The signed-in person's own balance rides along in the snapshot, so the
     leave screen needs no extra round trip. Anyone else's is fetched. */
  if(!raw && action === "leaveBalance"){
    const who = (payload && payload.email) || (AUTH.user && AUTH.user.email);
    if(AUTH.user && who === AUTH.user.email){
      try{
        const snap = await getSnapshot();
        if(snap && snap.balance) return snap.balance;
      }catch(e){}
    }
  }

  const key = action + "|" + JSON.stringify(payload || {});
  const hit = READ_CACHE.get(key);
  if(hit && (Date.now() - hit.at) < CACHE_MS) return hit.data;

  const res = await api(action, payload);
  if(res && res.ok===false){
    const reason=res.reason||"";
    let authMsg;
    if(reason.indexOf("CANNOT_VERIFY")===0){
      authMsg="The backend could not check the sign-in. In Apps Script, run the 'diagnose' function once and accept the permission prompt, then deploy a new version.";
    }else if(reason==="WRONG_DOMAIN"){
      authMsg="This account isn't on the org domain and isn't listed in Users — add it to Users.Email to allow this person to sign in.";
    }else{
      authMsg="The backend did not accept the sign-in"+(reason?(" ("+reason+")"):"")+". Check GOOGLE_CLIENT_ID matches in both files and that a new deployment version was published.";
    }
    const msgs={AUTH:authMsg,
      AUTH_HTML:"Backend needs authorisation (deployment access).",
      TIMEOUT:t("err_timeout"),
      NETWORK:t("err_network"),
      BAD_JSON:t("err_badjson")};
    throw new Error(msgs[res.error]||res.error||"Backend error");
  }
  const data = (res && res.data) ? res.data : [];
  READ_CACHE.set(key, {at:Date.now(), data});
  return data;
}

/* Emails are sent by Apps Script ONLY, inside the action that changes the
   data (createRequest, bookVehicle, decideLeave, ...). This function does
   NOT send anything — it only shows the on-screen confirmation of who the
   backend has just emailed.
   Do not re-add an api("sendEmail",...) call here: the backend has already
   sent the mail by the time we get here, and calling it again delivers a
   duplicate of every notification in the system. */
async function notify(event, payload){
  const map={
    request_raised:t("em_approvers_admin"),
    request_approved:t("em_requester_admin"),
    request_edited:t("em_reapproval"),
    request_escalated:t("em_layer2_admin"),
    vehicle_booked:t("em_driver_issuer"),
    trip_started:t("em_requester_admin"),
    trip_ended:t("em_requester_admin"),
    asset_requested:t("em_admin"),
    asset_issued:t("em_issuer"),
    asset_overdue:t("em_issuer_admin"),
    asset_returned:t("em_issuer"),
    leave_raised:t("em_approver_admin"),
    leave_decided:t("em_requester_admin")
  };
  if(map[event]) toast(map[event]);
  // The change log is written by Apps Script, which already knows who did
  // what. Nothing further is needed here — and nothing that could throw,
  // because this runs immediately after a successful save: an exception
  // here loses the confirmation and makes people submit twice.
}

/* Reference lists. These are filled from the sheet at sign-in
   (Projects, AssetItems, Vehicles, Drivers, N-LeaveApproval,
   N-ProjectApproval, Config tabs).
   Nothing here is hardcoded — empty until the backend answers. */
let BRAND    = { orgName:"Sahjeevan", logo:"" };
let PROJECTS = {};   // { project: [budget heads] }
let ASSETS   = {};   // { category: [items] }
let LEAVE_APPROVALS   = {};  // { staffMember: leaveApprover email }
let PROJECT_APPROVALS = {};  // { project: {layer1,layer1Name,layer2,layer2Name,layer3,layer3Name} }
/* Derived server-side, not from a manually-set flag — see isApproverForAnything
   in Code.gs. Determines whether the Approve nav tab shows at all. */
let IS_APPROVER = false;
/* Admin, but NOT Super Admin — day-to-day operational actions (booking a
   vehicle, recording a late mark, verifying an asset) are gated on this,
   not on AUTH.user.admin||AUTH.user.superAdmin. Super Admin still sees
   everything, just can't act on these specific screens. */
let IS_OPERATIONAL_ADMIN = false;
let ROUTES   = [];   // frequent stop shortcuts, from the Config tab
let VENDORS  = [];   // vendors hired before, for quick-fill on the booking form
/* Declared holidays from the Holidays tab, as {"2026-01-26":"Republic Day"}.
   Used only to show what a leave will cost BEFORE it's submitted — the
   backend recalculates the real figure on approval, so a stale copy here
   can never move anyone's actual balance. */
let HOLIDAYS = {};

/* ---- one-call snapshot -------------------------------------------------
   Apps Script costs roughly a second per call however much it returns, so
   every list the app needs is fetched together and served from here. Any
   write clears it, so screens never show something the user just changed. */
let SNAP = null, SNAP_AT = 0;
const SNAP_MS = 45000;
/* Which snapshot field answers which list request. */
const SNAP_MAP = {
  listRequests:"requests", listAssets:"assets", listLeaves:"leaves",
  listCompOff:"compOff", listLateMarks:"lateMarks", listTripDays:"tripDays",
  listKm:"km", kmSummary:"kmSummary", listApprovals:"approvals",
  listVendors:"vendors", listUsers:"users", listVehicles:"vehicles",
  listDrivers:"drivers", listLeaveApprovals:"leaveApprovals",
  listProjectApprovals:"projectApprovals"
};
function clearSnapshot(){ SNAP = null; }
async function getSnapshot(force){
  if(!force && SNAP && (Date.now() - SNAP_AT) < SNAP_MS) return SNAP;
  const d = await apiData("snapshot", {user: AUTH.user ? AUTH.user.email : ""}, true);
  SNAP = d || {}; SNAP_AT = Date.now();
  return SNAP;
}

/* One round trip fetches config, staff, matrix, vehicles, drivers,
   projects and asset items together. This used to be seven separate calls
   and was the main reason sign-in felt slow. */
async function loadReference(){
  let b = {};
  /* Was getSnapshot(true) — forced a second full Apps Script round trip on
     every sign-in, discarding the snapshot loadAccounts() just fetched a
     moment earlier via listUsers (which is in SNAP_MAP, so it also goes
     through getSnapshot()). loadReference() only ever runs right after
     loadAccounts() succeeds (see enterApp(), called from
     handleGoogleCredential()), so the unforced call below reuses that same
     snapshot — well within its 45s TTL — instead of fetching it twice. */
  try{ b = await getSnapshot() || {}; }
  catch(e){ console.warn("[snapshot] failed", e.message); }

  const cfg = b.config || {};
  BRAND.orgName = cfg.orgName || "Sahjeevan";
  ROUTES   = String(cfg.frequentRoutes||"").split(",").map(x=>x.trim()).filter(Boolean);
  PROJECTS = b.projects   || {};
  ASSETS   = b.assetItems || {};
  FLEET    = b.vehicles   || [];
  DRIVERS  = b.drivers    || [];
  ACCOUNTS = (b.users||[]).map(normalizeUser).filter(u=>u.email);
  VENDORS  = b.vendors    || [];
  HOLIDAYS = {};
  (b.holidays||[]).forEach(h=>{
    const d = String(h.date||"").slice(0,10);
    if(d) HOLIDAYS[d] = String(h.name||"Holiday");
  });
  IS_APPROVER          = !!b.isApprover;
  IS_OPERATIONAL_ADMIN = !!b.isOperationalAdmin;

  LEAVE_APPROVALS = {};
  (b.leaveApprovals||[]).forEach(row=>{
    const who = String(row.staffMember||"").trim();
    if(!who) return;
    LEAVE_APPROVALS[who.toLowerCase()] = String(row.leaveApprover||"").trim();
  });
  PROJECT_APPROVALS = b.projectApprovals || {};

  // The logo can be hundreds of KB, so it arrives separately and the app
  // does not wait for it — the built-in mark shows until it lands.
  apiData("getLogo").then(d=>{
    if(d && d.logo){ BRAND.logo = d.logo; applyBranding(); }
  }).catch(()=>{});
}

function normalizeUser(u){

  return {email:String(u.email||"").trim().toLowerCase(), name:u.name, role:u.role,
    superAdmin:b(u.superAdmin),canApprove:b(u.canApprove),admin:b(u.admin),driver:b(u.driver),

/* ===== Google Identity Services ===== */
function configReady(){
  return CONFIG.GOOGLE_CLIENT_ID && CONFIG.GOOGLE_CLIENT_ID.indexOf("PASTE_")!==0;
}
function decodeJwt(token){
  try{
    const base=token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
    const json=decodeURIComponent(atob(base).split("").map(c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join(""));
    return JSON.parse(json);
  }catch(e){ return null; }
}
function initGoogleLogin(){
  const status=document.getElementById("loginStatus");
  if(!configReady()){
    // No Client ID yet — show exactly what to do, don't leave a dead button.
    document.getElementById("gsiButton").innerHTML="";
    status.className="login-status";
    status.innerHTML=`<div class="login-setup">
      <b>Google sign-in needs a one-time setup.</b><br>
      Create a free OAuth <b>Client ID</b> in Google Cloud Console, then paste it into
      <code>CONFIG.GOOGLE_CLIENT_ID</code> in this file. Step-by-step is in
      <b>ENABLE_GOOGLE_LOGIN.md</b>.</div>`;
    return;
  }
  // Wait until the GSI library is present
  if(!(window.google && google.accounts && google.accounts.id)){
    return setTimeout(initGoogleLogin, 200);
  }
  google.accounts.id.initialize({
    client_id: CONFIG.GOOGLE_CLIENT_ID,
    callback: handleGoogleCredential,
    auto_select: false,
    cancel_on_tap_outside: true,
    use_fedcm_for_prompt: true,
    itp_support: true
  });
  google.accounts.id.renderButton(
    document.getElementById("gsiButton"),
    {theme:"outline", size:"large", type:"standard", text:"continue_with", shape:"rectangular", logo_alignment:"left", width:300}
  );
}
async function handleGoogleCredential(resp){
  const status=document.getElementById("loginStatus");
  status.className="login-status busy"; status.textContent=t("signing_in");
  const claims=decodeJwt(resp.credential);
  if(!claims || !claims.email){
    status.className="login-status err"; status.textContent="Could not read your Google account. Please try again.";
    return;
  }
  const email=String(claims.email).trim().toLowerCase();
  /* There is deliberately no client-side domain check here any more. The
     backend is the real gate (verifyToken in Code.gs): it accepts anyone on
     ALLOWED_DOMAIN, plus anyone listed exactly in Users.Email regardless of
     domain — and a personal Gmail account has no "hd" claim at all, so a
     check against claims.hd would have rejected exactly the people that
     allow-list exists to let in. If someone genuinely shouldn't sign in,
     the "not in Users" message below still catches them. */
  /* Store the signed token BEFORE any backend call. The backend verifies
     it on every request, so loading the staff directory without it here
     was rejected as unauthenticated. */
  AUTH.credential = resp.credential;
  AUTH.idToken    = email;

  // Match the signed-in email to a row in the Users sheet → that decides the role.
  let dirErr=null;
  try{ await loadAccounts(); }
  catch(e){
    // one retry after a short pause — Apps Script's first cold call can be slow
    await new Promise(r=>setTimeout(r,1200));
    try{ await loadAccounts(); }catch(e2){ dirErr=e2; }
  }
  if(dirErr || !ACCOUNTS.length){
    status.className="login-status err";
    status.innerHTML="Couldn't reach the staff directory.<br><span style='font-size:12px'>"+(dirErr?dirErr.message:t("no_users_returned"))+" — check the backend deployment, then retry.</span>";
    return;
  }
  const user=ACCOUNTS.find(u=>u.email===email);
  if(!user){
    status.className="login-status err";
    status.innerHTML="<b>"+esc(email)+"</b> "+t("not_in_users_msg");
    return;
  }
  await enterApp(user);
}
async function enterApp(user){
  AUTH.user=user;
  document.getElementById("loginView").style.display="none";
  document.getElementById("app").classList.add("on");
  document.getElementById("whoName").firstChild.textContent=user.name;
  document.getElementById("whoRole").textContent=user.role;
  document.getElementById("whoName2").textContent=user.name+" · "+user.role;
  /* buildNav()/startRouting() can't run until loadReference() resolves —
     they need PROJECTS/ASSETS/IS_APPROVER etc to decide what a person can
     even see. That leaves the sidebar shell with an empty nav and a blank
     content area for however long the remaining round trip takes. This
     doesn't shorten that wait (Apps Script's floor is still there) — it
     just gives the person something other than blank white to look at. */
  document.getElementById("content").innerHTML =
    `<div class="loading-shell"><span class="spinner" aria-hidden="true"></span>Loading your workspace…</div>`;
  await loadReference();       // one call: config, staff, fleet, drivers, projects, matrix
  applyBranding();
  buildNav();
  startRouting();
}

function routeFromHash(){
  const want = (location.hash||"").replace(/^#\/?/,"").split("?")[0];
  const allowed = MENU.filter(m=>m.show()).map(m=>m.id);
  return allowed.includes(want) ? want : allowed[0];

function startRouting(){
  window.addEventListener("popstate", ()=>{
    ROUTING = true;
    go(routeFromHash(), true);
    ROUTING = false;
  });
  const first = routeFromHash();
  history.replaceState({id:first}, "", "#/"+first);
  go(first, true);
}

function viewNew(){
  /* The Projects tab is the authority on which projects exist and what
     budget heads each has. The Users tab only says which of them a person
     may pick. Matching is case- and space-insensitive, because the two
     lists are typed by hand into different tabs and previously had to
     agree character for character — any mismatch silently left the person
     with a single "General" budget head and no explanation. */
  const all=Object.keys(PROJECTS);
  const norm=v=>String(v||"").trim().toLowerCase();
  const mine=(AUTH.user.projects||[]).filter(p=>p&&p!=="ALL");
  const canSeeAll=(AUTH.user.projects||[]).includes("ALL") || mine.length===0;

  let uniq, unknown=[];
  if(canSeeAll){
    uniq = all;
  }else{
    uniq = [];
    mine.forEach(p=>{
      const hit = all.find(a=>norm(a)===norm(p));
      if(hit){ if(!uniq.includes(hit)) uniq.push(hit); }   // use the Projects tab spelling
      else unknown.push(p);
    });

  }
  return `
  <div class="pagehead"><div><h3>${t("newreq_t")}</h3><p>${t("fields_required")}</p></div></div>

        ${!all.length?`<p class="muted" style="font-size:12px;margin:6px 0 0;color:var(--madder)">${t("projects_tab_empty")}</p>`:""}
        ${unknown.length?`<p class="muted" style="font-size:12px;margin:6px 0 0;color:var(--amber)">${t("not_in_projects")} ${esc(unknown.join(", "))} ${t("ask_add_project")}</p>`:""}
        </div>
    </div>
    <div class="grid3">
      <div class="field"><label>${t("date_travel")} <span class="req">*</span></label><input id="f_date" type="date" value="${todayISO()}" min="${todayISO()}"></div>
      <div class="field"><label>${t("time")} <span class="req">*</span></label><input id="f_time" type="time" value="07:00"></div>
      <div class="field"><label>${t("night_halt")}</label><select id="f_night"><option value="no">${t("no")}</option><option value="yes">${t("yes")}</option></select></div>
    </div>
    <div class="field"><label>${t("reason")} <span class="req">*</span></label><textarea id="f_reason" placeholder="e.g. FRA gram sabha documentation at Hodka"></textarea></div>
    <div class="grid2">

      <div class="field"><label>${t("budget_head")} <span class="req">*</span></label><select id="f_head"></select><p class="muted" id="headNote" style="font-size:12px;margin:6px 0 0"></p></div>

      <div class="routechips" id="routeChips">${ROUTES.map(n=>`<button type="button" onclick='addFrequentStop(${JSON.stringify({name:n})})'>${n}</button>`).join("")}</div>
    </div>

function onProj(){
  const sel=document.getElementById("f_proj");
  if(!sel) return;
  const proj=sel.value;

async function submitRequest(){
  const reason=val("f_reason"),date=val("f_date"),time=val("f_time");
  const err=document.getElementById("newErr");
  if(!reason||!date||!time){err.innerHTML=warnBox(t("fill_date_time_reason"));return;}
  const stops=[...document.querySelectorAll("#stops .minirow")]
    .map(r=>({n:r.querySelector(".snm").value.trim()}))
    .filter(x=>x.n);
  const travellers=[...document.querySelectorAll("#travs .tnm")].map(i=>i.value).filter(Boolean);
  if(!travellers.length){err.innerHTML=warnBox(t("need_traveller"));return;}
  const btn=document.getElementById("submitReqBtn");
  const ok=await safeSubmit(btn,"newErr",async()=>{
    const res=await api("createRequest",{by:AUTH.user.email,byName:AUTH.user.name,project:val("f_proj"),date,time,reason,
      budget:val("f_budget"),head:val("f_head"),nightHalt:val("f_night")==="yes",stops,travellers,people:travellers.length});
    if(!res||res.ok===false||!res.data||!res.data.id) throw new Error((res&&res.error)||t("no_server_confirm"));
    await notify("request_raised",{id:res.data.id});
  });
  if(ok) go("mine");
}
function warnBox(m){return `<div class="notice warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>${m}</div>`;}

async function viewList(mode){

      <td>${statusPill(x.status)}</td>
      <td>${rowActions(x,mode)}</td></tr>`).join("")}
  </tbody></table></div>`;

function rowActions(x,mode){
  let b=`<button class="btn ghost sm" onclick='openReq(${JSON.stringify(x.id)})'>${t("view")}</button>`;
  // Owner edit/cancel while not completed/cancelled (item 2)
  if(mode==="mine" && x.by===AUTH.user.email && !["completed","cancelled"].includes(x.status)){
    b+=` <button class="btn ghost sm" onclick='openEdit("${x.id}")'>${t("edit")}</button>
         <button class="btn madder sm" onclick='cancelReq("${x.id}")'>${t("cancel")}</button>`;
  }
  // Requester-triggered escalation to Layer 2 — only while Layer 1 hasn't
  // acted, and only if the project actually has a Layer 2 configured.
  if(mode==="mine" && x.by===AUTH.user.email && x.status==="pending" && !x.escalated && projectHasLayer2(x.project)){
    b+=` <button class="btn ghost sm" onclick='escalateReq("${x.id}")'>${t("escalate")}</button>`;
  }
  // Approve = approver; (print + approve already admin-restricted elsewhere, item 6)
  if(mode==="approve"&&x.status==="pending"){
    if(x.by===AUTH.user.email)return `<span class="muted" style="font-size:12px">${t("own_req_note")}</span>`;
    // Browsing every project's pending requests is fine (as decided), but
    // the decide buttons themselves only appear for whoever is actually
    // authorised to act on THIS one — Layer 1, Layer 2 post-escalation, or
    // admin. The backend enforces this regardless; this just avoids
    // showing a button that would fail if pressed.
    if(canDecideVehicleRequest(x)){
      b+=` <button class="btn grass sm" onclick='decide("${x.id}","approved")'>${t("approve")}</button>
           <button class="btn madder sm" onclick='askReject("${x.id}")'>${t("reject")}</button>`;
    }else{
      b+=` <span class="muted" style="font-size:12px">${t("not_your_approval")}</span>`;
    }
  }
  return b;
}
/* Whether the signed-in person can actually decide THIS request: Layer 1
   for its project, Layer 2 once it's been escalated, or admin/superAdmin.
   Uses the same PROJECT_APPROVALS data the Escalate button already reads —
   no extra round trip. */
function canDecideVehicleRequest(x){
  if(AUTH.user.admin||AUTH.user.superAdmin) return true;
  const c=PROJECT_APPROVALS[x.project];
  if(!c) return false;
  if(c.layer1 && c.layer1===AUTH.user.email) return true;
  if(x.escalated && c.layer2 && c.layer2===AUTH.user.email) return true;
  return false;
}
/* Whether the project this request belongs to has a Layer 2 approver
   configured, so the Escalate button never appears as a dead end. */
function projectHasLayer2(project){
  const c=PROJECT_APPROVALS[project];
  return !!(c && c.layer2);
}
async function escalateReq(id){
  const res=await api("escalateRequest",{id});
  if(!res||res.ok===false){ toast((res&&res.error)||t("no_server_confirm")); return; }
  await notify("request_escalated",{id});
  toast(t("escalated_toast"));
  render();
}
/* Small "Escalated" badge, shown next to a request's ID wherever it's
   listed — same visual pattern as the existing "edited" badge. */
function escalatedBadge(x){
  return x.escalated ? ` <span class="editbadge">${t("badge_escalated")}</span>` : "";
}
/* Odometer-implausibility badge (§6.3) — set once someone has confirmed
   an unusual reading anyway, so it stays visible for admin review without
   having blocked anyone at the time. */
function flaggedBadge(x){
  return x.flagged ? ` <span class="editbadge" style="background:var(--madder,#a33);color:#fff">${t("badge_flagged")}</span>` : "";
}
async function decide(id,decision){

let VEH_TYPE="internal";
function setVehType(v){
  VEH_TYPE=v;
  document.querySelectorAll("#vehSeg button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  document.getElementById("internalBox").classList.toggle("hide",v!=="internal");
  document.getElementById("externalBox").classList.toggle("hide",v!=="external");
  const ip=document.getElementById("intPhoneBox");
  if(ip) ip.classList.toggle("hide",v!=="internal");   // external has its own phone field
}
/* Quick-fill from a previous hire. Every field stays editable — vendors
   send different drivers and vehicles from one trip to the next. */
function fillVendor(i){
  if(i==="") return;
  const v=VENDORS[+i]; if(!v) return;
  const set=(id,val)=>{const e=document.getElementById(id); if(e) e.value=val||"";};
  set("v_company",v.company); set("v_driver",v.driverName); set("v_phone",v.driverPhone);
  set("v_vname",v.vehicleName); set("v_vnum",v.vehicleNumber);
}
function fillDriverPhone(){
  const sel=document.getElementById("b_drv"); if(!sel)return;
  const ph=sel.options[sel.selectedIndex]?.dataset.phone||"";
  if(document.getElementById("b_dphone")&&!val("b_dphone"))document.getElementById("b_dphone").value=ph;
}
async function doBook(id){
  return safeSubmit(document.getElementById("bookBtn"),"bookErr",()=>_doBook(id));
}
async function _doBook(id){
  let payload={id,vehType:VEH_TYPE,driverPhone:val("b_dphone")||null};
  if(VEH_TYPE==="internal"){
    payload.veh=val("b_veh"); payload.driver=val("b_drv"); payload.vendor=null;
  }else{
    const need=["v_company","v_driver","v_phone","v_vname","v_vnum"];
    if(need.some(f=>!val(f))){ throw new Error(t("vendor_fill_all")); }
    payload.company     = val("v_company");
    payload.driver      = val("v_driver");
    payload.driverPhone = val("v_phone");
    payload.vehicleName = val("v_vname");
    payload.vehicleNumber = val("v_vnum");
    payload.vendorNote  = val("v_note");
    payload.veh         = (val("v_vname")+" "+val("v_vnum")).trim();
  }
  await api("bookVehicle",payload);
  await notify("vehicle_booked",{id});
  render();
  // Offer the WhatsApp hand-off while the admin is still on the screen.
  const bk=(await apiData("listRequests")).find(x=>x.id===id);
  /* This only asks "is there a number to message?" — it does NOT compose
     the message. That happens in sendWA(), in whichever language the admin
     picks from the dropdown inside waButton() below. It used to build a
     full English message here and throw it away, which read as though the
     hand-off were hardcoded to English. */
  const hasNumber = !!(bk && normPhone(bk.driverPhone));
  if(hasNumber){
    openModal(statusText("booked")+" · "+esc(id),`
      <p style="margin:0 0 12px;font-size:14px">${esc(bk.veh)} assigned to <b>${esc(bk.driver)}</b>. ${t("driver_issuer_emailed")}</p>
      <p class="muted" style="font-size:12.5px;margin:0">${t("wa_sent")}</p>`,
      `<button class="btn ghost" onclick="closeModal()">${t("close")}</button>${waButton(bk,"grass")}`);
  }else{
    closeModal();
    toast(statusText("booked")+" · driver & issuer emailed");
  }
}
/* Starting a trip now captures the opening odometer reading. The driver
   normally does this; an admin can do it on their behalf. The reading is
   pre-filled with the vehicle's last recorded closing reading, so in the
   usual case the driver only has to confirm it. */
async function openStart(id){
  const r=(await apiData("listRequests")).find(x=>x.id===id);
  let suggested="";
  try{
    const sum=await apiData("kmSummary");
    const v=sum.find(x=>x.vehicle===(r&&r.veh));
    if(v&&v.lastOdometer) suggested=v.lastOdometer;
  }catch(e){}
  openModal(t("start_trip")+" · "+id,`
    <div class="grid2">
      <div class="field"><label>${t("start_km")} <span class="req">*</span></label>
        <input id="s_skm" type="number" inputmode="numeric" value="${suggested}" placeholder="48210"></div>
      <div class="field"><label>${t("start_time")} <span class="req">*</span></label>
        <input id="s_stm" type="time" value="${nowHM()}"></div>
    </div>
    ${suggested?`<p class="muted" style="font-size:12px;margin:0 0 8px">${t("last_reading_was").replace("{v}",r.veh).replace("{n}",suggested)}</p>`:""}
    <div id="sErr"></div>`,
    `<button class="btn ghost" onclick="closeModal()">${t("cancel")}</button>
     <button class="btn grass" id="startBtn" onclick='doStart("${id}")'>${t("start_trip")}</button>`);
}
async function doStart(id, confirmed){
  return safeSubmit(document.getElementById("startBtn"),"sErr",()=>_doStart(id, confirmed));
}
async function _doStart(id, confirmed){
  const skm=+val("s_skm")||null, e=document.getElementById("sErr");
  if(!skm||skm<=0){ e.innerHTML=warnBox(t("need_open_km")); return; }
  const res=await api("startTrip",{id,t:val("s_stm")||nowHM(),startKm:skm, confirm:!!confirmed});
  if(res && res.needsConfirm){
    // The reading looks implausible against the vehicle's last recorded
    // one — held, not saved, until the person explicitly confirms it.
    e.innerHTML=confirmBox(res.message, `doStart('${id}', true)`);
    return;
  }
  if(!res||res.ok===false) throw new Error((res&&res.error)||t("no_server_confirm"));
  await notify("trip_started",{id});
  closeModal();
  const g=res&&res.data?res.data.gap:0;
  if(g && Math.abs(g)>=5){
    // Recorded, not blocked — but say so plainly so it can be corrected.
    toast(g>0 ? (g+" km more than the last closing reading — admin notified")
              : (Math.abs(g)+" km less than the last closing reading — please check"));
  }else{
    toast(t("start_trip")+" ✓ · "+skm+" km");
  }
  render();
}
async function openComplete(id){
  const r=(await apiData("listRequests")).find(x=>x.id===id);

    <div class="grid2">

      <div class="field"><label>${t("end_time")} <span class="req">*</span></label><input id="c_etm" type="time" value="${nowHM()}"></div>
    </div><div id="cErr"></div>`,

async function doComplete(id, confirmed){

async function _doComplete(id, confirmed){
  const r=(await apiData("listRequests")).find(x=>x.id===id);
  const ekm=+val("c_ekm")||null,e=document.getElementById("cErr");
  if(ekm&&r.startKm&&ekm<=r.startKm){e.innerHTML=warnBox("End km must be greater than start km ("+r.startKm+").");return;}
  const res=await api("closeTrip",{id,endKm:ekm,endTime:val("c_etm")||nowHM(), confirm:!!confirmed});

  closeModal();toast(statusText("completed")+" · km logged");render();
}
/* Shared "this looks off — save it anyway?" box for odometer entries that
   are recorded, never blocked, but implausible enough to double-check
   (§6.3). `onConfirmCall` is a literal JS call re-submitting with
   confirm:true — same inline-onclick pattern the rest of this file uses. */
function confirmBox(message, onConfirmCall){
  return `<div class="notice warn" style="margin-bottom:8px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
    <div>${esc(message)}
      <div style="margin-top:8px"><button type="button" class="btn madder sm" onclick="${onConfirmCall}">${t("confirm_anyway")}</button></div>
    </div></div>`;
}

/* ======================================================================
   MULTI-DAY TRIPS
   A trip that runs over more than one day is logged a day at a time:
   opening and closing odometer plus times for each day. Works the same
   whether the trip was booked as two days or started as one and ran over.
   ====================================================================== */
async function openTripDays(id){
  const [reqs, days] = await Promise.all([apiData("listRequests"), apiData("listTripDays")]);
  const r = reqs.find(x=>x.id===id) || {};
  const mine = days.filter(d=>d.reqId===id)
    .sort((a,b)=>(Number(a.dayNo)||0)-(Number(b.dayNo)||0));
  const total = mine.reduce((n,d)=>n+(Number(d.km)||0),0);
  const lastEnd = mine.length ? mine[mine.length-1].endKm : "";

  openModal(t("trip_days")+" · "+esc(id), `
    <p class="muted" style="font-size:12.5px;margin:0 0 12px">${t("trip_days_help")}</p>
    ${mine.length?`<div class="tablewrap" style="margin-bottom:12px"><table><thead><tr>
      <th>${t("day")}</th><th>${t("h_date")}</th><th>${t("start_km")}</th><th>${t("end_km")}</th>
      <th>${t("total_km")}</th><th></th></tr></thead><tbody>
      ${mine.map(d=>`<tr>
        <td><b>${esc(d.dayNo)}</b>${flaggedBadge(d)}</td><td>${fmtD(d.date)}<div class="muted">${fmtT(d.startTime)}–${fmtT(d.endTime)}</div></td>
        <td>${esc(d.startKm)||"—"}</td><td>${esc(d.endKm)||"—"}</td><td>${esc(d.km)||"—"}</td>
        <td><button class="btn ghost sm" onclick='removeTripDay("${id}",${Number(d.dayNo)||0})'>${t("remove")}</button></td>
      </tr>`).join("")}
      <tr><td colspan="4" style="text-align:right"><b>${t("trip_total")}</b></td>
          <td><b>${total||"—"}</b></td><td></td></tr>
    </tbody></table></div>`:""}

    <h4 style="font-size:13px;margin:0 0 8px">${t("add_day")} ${mine.length+1}</h4>
    <div class="grid2">
      <div class="field"><label>${t("h_date")} <span class="req">*</span></label>
        <input id="td_date" type="date" value="${nextTripDate(r, mine)}"></div>
      <div class="field"><label>${t("start_km")} <span class="req">*</span></label>
        <input id="td_skm" type="number" inputmode="numeric" value="${lastEnd||""}"
          placeholder="${t("start_km")}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>${t("start_time")}</label><input id="td_stm" type="time" value="${nowHM()}"></div>
      <div class="field"><label>${t("end_km")}</label><input id="td_ekm" type="number" inputmode="numeric"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>${t("end_time")}</label><input id="td_etm" type="time"></div>
      <div class="field"><label>${t("note")}</label><input id="td_note" placeholder="${t("optional")}"></div>
    </div>
    ${lastEnd?`<p class="muted" style="font-size:12px;margin:0 0 8px">${t("carried_over").replace("{n}",lastEnd)}</p>`:""}
    <div id="tdErr"></div>`,
    `<button class="btn ghost" onclick="closeModal()">${t("close")}</button>
     <button class="btn" id="tripDayBtn" onclick='doTripDay("${id}",${mine.length+1})'>${t("save")}</button>`);
}
/* Day 1 defaults to the travel date; later days follow the previous one. */
function nextTripDate(r, mine){
  if(!mine.length) return String(r.date||"").slice(0,10) || todayISO();
  const last=new Date(String(mine[mine.length-1].date||"").slice(0,10)+"T00:00:00");
  if(isNaN(last)) return todayISO();
  last.setDate(last.getDate()+1);
  return last.getFullYear()+"-"+("0"+(last.getMonth()+1)).slice(-2)+"-"+("0"+last.getDate()).slice(-2);
}
async function doTripDay(id, dayNo, confirmed){
  return safeSubmit(document.getElementById("tripDayBtn"),"tdErr",()=>_doTripDay(id,dayNo,confirmed));
}
async function _doTripDay(id, dayNo, confirmed){
  const date=val("td_date"), skm=+val("td_skm")||null, ekm=+val("td_ekm")||null;
  if(!date||!skm) throw new Error(t("day_need"));
  if(ekm && ekm<=skm) throw new Error(t("day_end_low"));
  const res=await api("saveTripDay",{reqId:id, dayNo, date, startKm:skm, endKm:ekm||"",
    startTime:val("td_stm"), endTime:val("td_etm"), driver:AUTH.user.name, note:val("td_note"),
    confirm:!!confirmed});
  if(res && res.needsConfirm){
    const e=document.getElementById("tdErr");
    if(e) e.innerHTML=confirmBox(res.message, `doTripDay('${id}', ${dayNo}, true)`);
    return;
  }
  if(!res||res.ok===false) throw new Error((res&&res.error)||t("no_server_confirm"));
  closeModal();
  toast(t("day_saved").replace("{n}",dayNo)+(res.data&&res.data.km?(" · "+res.data.km+" km"):""));
  openTripDays(id);
}
async function removeTripDay(id, dayNo){
  await api("deleteTripDay",{reqId:id, dayNo});
  toast(t("day_removed")); openTripDays(id);
}

/* ---- NON-WORKING DAYS — must mirror isNonWorkingDay() in Code.gs -------
   Sundays, the 1st and 3rd Saturday of each month, and any declared
   holiday are not deducted from a leave tally. If these rules ever change,
   change them in BOTH files: the backend decides the real balance, this
   copy only decides what the screen says, and the two disagreeing is worse
   than either being wrong on its own. */
function nonWorkingReason(dateStr){
  const s=String(dateStr||"").slice(0,10);
  if(!s) return null;
  if(HOLIDAYS[s]) return HOLIDAYS[s];
  const d=new Date(s+"T00:00:00");
  if(isNaN(d)) return null;
  const dow=d.getDay();
  if(dow===0) return t("h_sunday");
  if(dow===6){
    const nth=Math.ceil(d.getDate()/7);
    if(nth===1) return t("h_sat1");
    if(nth===3) return t("h_sat3");
  }
  return null;
}
/* Which days inside a range are free, and why. */
function nonWorkingIn(from,to){
  const a=String(from||"").slice(0,10), b=String(to||from||"").slice(0,10);
  if(!a||!b) return [];
  const start=new Date(a+"T00:00:00"), end=new Date(b+"T00:00:00");
  if(isNaN(start)||isNaN(end)||end<start) return [];
  const out=[];
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const s=`${d.getFullYear()}-${("0"+(d.getMonth()+1)).slice(-2)}-${("0"+d.getDate()).slice(-2)}`;
    const why=nonWorkingReason(s);
    if(why) out.push({date:s, reason:why});
  }
  return out;
}
/* Raw calendar span of an absence, holidays included. */
function calendarDays(x){
  const a=new Date(String(x.from||"").slice(0,10)+"T00:00:00");
  const b=new Date(String(x.to||x.from||"").slice(0,10)+"T00:00:00");
  const n=Math.round((b-a)/86400000)+1;
  return (isNaN(n)||n<1)?0:n;
}
/* Days actually deducted — the calendar span minus its non-working days.
   This is the figure that matches the backend's balance maths. */
function leaveDays(x){
  const span=calendarDays(x);
  if(!span) return "—";
  const free=nonWorkingIn(x.from, x.to||x.from).length;
  return Math.max(0, span-free);
}
/* "5 days · 2 not counted" for a leave row, so the difference between the
   time off taken and the balance deducted is visible rather than looking
   like an arithmetic error. */
function leaveDaysDetail(x){
  const span=calendarDays(x);
  if(!span) return "—";
  const free=nonWorkingIn(x.from, x.to||x.from).length;
  const charged=Math.max(0, span-free);
  return free
    ? `${charged}<div class="muted" style="font-size:11.5px">${t("lv_not_counted").replace("{n}",free)}</div>`
    : String(charged);
}
function quarterEndOf(dateStr){
  const d=String(dateStr||"").slice(0,10);
  const y=+d.slice(0,4), m=+d.slice(5,7);
  if(!y||!m) return "";
  const q=Math.floor((m-1)/3)+1;
  const end=new Date(y, q*3, 0);
  return end.getFullYear()+"-"+("0"+(end.getMonth()+1)).slice(-2)+"-"+("0"+end.getDate()).slice(-2);
}

/* Staff Directory, Leave Tracker, Approval routing, Approvals log and the

   open to everyone. A regular staff member landing here (or a driver-
   excluded... no, drivers don't reach this screen at all) sees only the
   Asset log; the other tab buttons simply aren't rendered for them. */
function staffCanSeeExtra(){ return AUTH.user.admin||AUTH.user.superAdmin; }
async function viewStaff(){
  if(!staffCanSeeExtra() && STAFF_TAB!=="assets") STAFF_TAB="assets";
  const extra = staffCanSeeExtra();
  return `<div class="subtabs" id="staffTabs">
    ${extra?`<button data-tab="list" class="${STAFF_TAB==='list'?'on':''}" onclick="staffTab('list')">${t("staff_list")}</button>`:""}
    ${extra?`<button data-tab="matrix" class="${STAFF_TAB==='matrix'?'on':''}" onclick="staffTab('matrix')">${t("approval_matrix")}</button>`:""}
    <button data-tab="assets" class="${STAFF_TAB==='assets'?'on':''}" onclick="staffTab('assets')">${t("asset_log")}</button>
    ${extra?`<button data-tab="leave" class="${STAFF_TAB==='leave'?'on':''}" onclick="staffTab('leave')">${t("leave_tracker")}</button>`:""}
    ${extra?`<button data-tab="approvals" class="${STAFF_TAB==='approvals'?'on':''}" onclick="staffTab('approvals')">${t("approvals_log")}</button>`:""}
    ${extra?`<button data-tab="km" class="${STAFF_TAB==='km'?'on':''}" onclick="staffTab('km')">${t("km_logbook")}</button>`:""}
  </div><div id="staffBody">${await staffBody()}</div>`;
}
/* The active tab is derived from STAFF_TAB, not from the click event.
   The filter bar calls this function programmatically, and reading the
   global `event` there picked up the date input instead of the tab button —
   which stripped the highlight off every tab. */
function staffTab(x){
  // Defense in depth: even if something forces one of the restricted tab
  // names in, staffBody() below re-checks before rendering any of them.
  STAFF_TAB=x;
  const host=document.getElementById("staffBody");
  if(host) host.innerHTML=`<p class="muted" style="padding:14px">${t("loading")}</p>`;
  staffBody().then(h=>{ const el=document.getElementById("staffBody"); if(el) el.innerHTML=h; });
  document.querySelectorAll("#staffTabs button").forEach(b=>{
    b.classList.toggle("on", b.dataset.tab===x);
  });
}
async function staffBody(){
  if(STAFF_TAB!=="assets" && !staffCanSeeExtra()) STAFF_TAB="assets";
  if(STAFF_TAB==="list"&&staffCanSeeExtra())return staffListTab();
  if(STAFF_TAB==="matrix"&&staffCanSeeExtra())return matrixTab();
  if(STAFF_TAB==="assets")return await assetLogTab();
  if(STAFF_TAB==="leave"&&staffCanSeeExtra())return await leaveTrackerTab();
  if(STAFF_TAB==="approvals"&&staffCanSeeExtra())return await approvalsTab();
  if(STAFF_TAB==="km"&&staffCanSeeExtra())return await kmTab();
  return await assetLogTab();
}
function staffListTab(){
  return `<div class="tablewrap"><table><thead><tr><th>${t("h_name")}</th><th>${t("h_email")}</th><th>${t("h_role")}</th><th>${t("h_phone")}</th><th>${t("h_projects")}</th><th>${t("h_approver_q")}</th></tr></thead><tbody>
  ${ACCOUNTS.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td class="muted">${esc(u.email)}</td><td>${u.role||"—"}</td><td>${u.phone||"—"}</td><td>${escJoin(u.projects)||"—"}</td><td>${isApproverUser(u)?"✓":"—"}</td></tr>`).join("")||`<tr><td colspan="6" class="muted">${t("m_no_staff")}</td></tr>`}
  </tbody></table></div>`;
}
/* Whether a given user is an approver for anything right now — derived the
   same way the backend derives it (N-LeaveApproval, N-ProjectApproval,
   admin/superAdmin), not from the old manual canApprove checkbox, which
   could say yes for someone no longer actually routed anything. */
function isApproverUser(u){
  if(u.admin||u.superAdmin) return true;
  const email=String(u.email||"").trim().toLowerCase();
  if(Object.values(LEAVE_APPROVALS).some(a=>String(a||"").trim().toLowerCase()===email)) return true;
  return Object.values(PROJECT_APPROVALS).some(c=>
    (c.layer1&&c.layer1===email) || (c.layer2&&c.layer2===email));
}
function matrixTab(){
  const nm=e=>{const u=ACCOUNTS.find(x=>x.email===String(e||"").toLowerCase());return u?u.name:(e||"—");};
  const leaveRows=Object.keys(LEAVE_APPROVALS).map(who=>{
    const label=who.indexOf("@")>-1 ? nm(who) : who;   // some staff (e.g. drivers) are keyed by name, not email
    return `<tr><td><b>${esc(label)}</b>${who.indexOf("@")>-1?`<div class="muted" style="font-size:11.5px">${esc(who)}</div>`:""}</td>
      <td>${esc(nm(LEAVE_APPROVALS[who]))}<div class="muted" style="font-size:11.5px">${esc(LEAVE_APPROVALS[who]||"—")}</div></td></tr>`;
  }).join("");
  const projRows=Object.keys(PROJECT_APPROVALS).sort().map(proj=>{
    const c=PROJECT_APPROVALS[proj];
    const layer=(email,name)=>email?`${esc(name||email)}<div class="muted" style="font-size:11.5px">${esc(email)}</div>`:'<span class="muted">—</span>';
    return `<tr><td><b>${esc(proj)}</b></td><td>${layer(c.layer1,c.layer1Name)}</td><td>${layer(c.layer2,c.layer2Name)}</td></tr>`;
  }).join("");
  return `
  <h3 style="font-size:15px;margin:0 0 6px">${t("leave_approval_routing")}</h3>
  <p class="muted" style="font-size:12.5px;margin:0 0 10px">${t("leave_matrix_note")}</p>
  <div class="tablewrap" style="margin-bottom:22px"><table><thead><tr><th>${t("h_staff")}</th><th>${t("h_leave_approver")}</th></tr></thead><tbody>
  ${leaveRows || `<tr><td colspan="2" class="muted">${t("m_no_staff")}</td></tr>`}
  </tbody></table></div>

  <h3 style="font-size:15px;margin:0 0 6px">${t("project_approval_routing")}</h3>
  <p class="muted" style="font-size:12.5px;margin:0 0 10px">${t("project_matrix_note")}</p>
  <div class="tablewrap"><table><thead><tr><th>${t("project")}</th><th>${t("approver_n")} 1</th><th>${t("approver_n")} 2</th></tr></thead><tbody>
  ${projRows || `<tr><td colspan="3" class="muted">${t("none_projects_tab")}</td></tr>`}
  </tbody></table></div>`;
}

async function leaveTrackerTab(){
  const K="leave", st=repState(K);
  const all=(await apiData("listLeaves"));
  // Range is matched on the leave dates themselves, so "August" finds leave
  // taken in August even if it was applied for in July.
  const rows=all.filter(x=>{
    if(st.person && x.byName!==st.person) return false;
    if(st.status && x.status!==st.status) return false;
    if(!st.from && !st.to) return true;
    const a=String(x.from||"").slice(0,10), b=String(x.to||x.from||"").slice(0,10);
    if(!a) return false;
    if(st.from && b && b < st.from) return false;
    if(st.to   && a > st.to)        return false;
    return true;
  });
  /* Was a raw inclusive calendar count, which disagreed with the balance
     the backend actually deducts. Uses the shared rules now. */
  const days=x=>leaveDays(x);
  const cols=[
    {label:"ID",           get:x=>x.id},
    {label:"Staff",        get:x=>x.byName},
    {label:"Email",        get:x=>x.by},
    {label:"Type",         get:x=>x.type},
    {label:"Requested on", get:x=>x.reqDate},
    {label:"From",         get:x=>x.from},
    {label:"To",           get:x=>x.to},
    {label:"Calendar days",get:x=>calendarDays(x)||""},
    {label:"Not counted",  get:x=>nonWorkingIn(x.from,x.to||x.from).length||""},
    {label:"Days deducted",get:days},
    {label:"Reason",       get:x=>x.reason},
    {label:"Status",       get:x=>statusText(x.status)},
    {label:"Decided by",   get:x=>x.decidedBy||""},
    {label:"Decided on",   get:x=>x.decidedDate||""}
  ];
  repCapture(K,"Leave register",cols,rows);
  const totalDays=rows.reduce((n,x)=>n+(Number(days(x))||0),0);
  return repBar(K,{dateLabel:t("dl_leave"), people:uniqSorted(all,x=>x.byName),
                   statuses:uniqSorted(all,x=>x.status)})
  + repCount(K,rows.length,all.length)
  + (rows.length?`<div class="row" style="margin-bottom:12px">
      <div class="stat i"><div class="n">${rows.length}</div><div class="l">${t("applications")}</div></div>
      <div class="stat g"><div class="n">${totalDays}</div><div class="l">${t("days_applied")}</div></div>
      <div class="stat a"><div class="n">${uniqSorted(rows,x=>x.byName).length}</div><div class="l">${t("staff_count")}</div></div>
    </div>`:"")
  + `<div class="tablewrap"><table><thead><tr><th>${t("h_id")}</th><th>${t("h_staff")}</th><th>${t("leave_type")}</th><th>${t("req_date")}</th><th>${t("h_applied_for")}</th><th>${t("h_days")}</th><th>${t("h_decided_by")}</th><th>${t("approved_date")}</th><th>${t("status")}</th></tr></thead><tbody>
  ${rows.map(x=>`<tr><td><b>${esc(x.id)}</b></td><td>${esc(x.byName)}</td><td>${t(x.type)}</td><td>${fmtD(x.reqDate)}</td><td>${fmtRange(x.from,x.to)}</td><td>${days(x)||"—"}</td><td>${esc(x.decidedBy)||"—"}</td><td>${fmtTS(x.decidedDate)}</td><td>${statusPill(x.status)}</td></tr>`).join("")||`<tr><td colspan="9" class="muted">${t("f_none_range")}</td></tr>`}
  </tbody></table></div>`;
}

async function kmTab(){
  // Totals come from the backend, so the figures on screen always match
  // the monthly km report that is emailed to admins.
  const [km, summary] = await Promise.all([apiData("listKm"), apiData("kmSummary")]);
  const cards = summary.length
    ? summary.map(v=>`<div class="stat i"><div class="n">${v.totalKm}</div><div class="l">${esc(v.vehicle)}<br><span style="font-weight:500">${v.trips} ${t("trips_count").toLowerCase()}${v.cost?` · ₹${v.cost.toLocaleString("en-IN")}`:""}${v.lastOdometer?` · odo ${v.lastOdometer}`:""}</span><div style="margin-top:6px"><button class="btn ghost sm" onclick='vehicleReport("${esc(v.vehicle)}")'>${t("view_report")}</button></div></div></div>`).join("")
    : `<span class="muted">${t("no_vehicles_yet")}</span>`;
  const K="km", st=repState(K);
  const rows=km.filter(x=>inRange(x.ts,st)
    && (!st.vehicle || x.vehicle===st.vehicle)
    && (!st.person  || x.driver===st.person));
  const rangeKm=rows.reduce((n,x)=>n+(Number(x.km)||0),0);
  const rangeCost=rows.reduce((n,x)=>n+(Number(x.cost)||0),0);
  const cols=[
    {label:"Date",        get:x=>x.ts},
    {label:"Vehicle",     get:x=>x.vehicle},
    {label:"Request",     get:x=>x.reqId},
    {label:"Project",     get:x=>x.project||""},
    {label:"Budget head", get:x=>x.budgetHead||""},
    {label:"Driver",      get:x=>x.driver},
    {label:"Start km",    get:x=>x.startKm},
    {label:"End km",      get:x=>x.endKm},
    {label:"Km run",      get:x=>x.km},
    {label:"Cost (INR)",  get:x=>x.cost||""},
    {label:"Odometer gap",get:x=>x.odoGap||""}
  ];
  repCapture(K,t("km_logbook"),cols,rows);

  /* ---- VEHICLE-WISE SUMMARY (its own report + its own export) ---------
     The logbook above is trip-level: one row per closed trip. What was
     missing was the vehicle-wise view as an exportable REPORT — the only
     per-vehicle output was a modal reached by clicking a stat card, and
     even that exported the trip list, not a per-vehicle summary.
     Built from `rows`, which is the already-filtered set, so this summary
     honours the date/vehicle/driver filters above it — unlike the stat
     cards, which come from the backend and are lifetime totals. That's
     deliberate: the cards answer "what has this vehicle ever done", the
     table answers "what did each vehicle do in the period I selected". */
  const byVeh = {};
  rows.forEach(x=>{
    const v = String(x.vehicle||"").trim() || "—";
    if(!byVeh[v]) byVeh[v] = {vehicle:v, trips:0, km:0, cost:0, drivers:new Set(),
                              projects:new Set(), first:"", last:"", lastOdo:""};
    const g = byVeh[v];
    g.trips += 1;
    g.km    += Number(x.km)||0;
    g.cost  += Number(x.cost)||0;
    if(x.driver)  g.drivers.add(String(x.driver));
    if(x.project) g.projects.add(String(x.project));
    const d = String(x.ts||"").slice(0,10);
    if(d){ if(!g.first || d < g.first) g.first = d; if(!g.last || d > g.last) g.last = d; }
    if(x.endKm!==null && x.endKm!==undefined && x.endKm!=="") g.lastOdo = x.endKm;
  });
  const vehRows = Object.keys(byVeh).sort().map(v=>{
    const g = byVeh[v];
    return {vehicle:g.vehicle, trips:g.trips, km:Math.round(g.km*100)/100,
            cost:Math.round(g.cost), avgKm: g.trips ? Math.round(g.km/g.trips) : 0,
            drivers:[...g.drivers].sort().join(", "), projects:[...g.projects].sort().join(", "),
            first:g.first, last:g.last, lastOdo:g.lastOdo};
  });
  const VK = "kmveh";
  repCapture(VK, t("vw_export"), [
    {label:"Vehicle",       get:x=>x.vehicle},
    {label:"Trips",         get:x=>x.trips},
    {label:"Total km",      get:x=>x.km},
    {label:"Avg km / trip", get:x=>x.avgKm},
    {label:"Cost (INR)",    get:x=>x.cost||""},
    {label:"First trip",    get:x=>x.first||""},
    {label:"Last trip",     get:x=>x.last||""},
    {label:"Last odometer", get:x=>x.lastOdo||""},
    {label:"Drivers",       get:x=>x.drivers||""},
    {label:"Projects",      get:x=>x.projects||""}
  ], vehRows);
  const totKm  = vehRows.reduce((n,v)=>n+v.km,0);
  const totTr  = vehRows.reduce((n,v)=>n+v.trips,0);
  const totCost= vehRows.reduce((n,v)=>n+v.cost,0);
  const vehTable = vehRows.length ? `
    <div class="tablewrap" style="margin-bottom:18px"><table><thead><tr>
      <th>${t("vehicle")}</th><th class="rt">${t("trips_count")}</th><th class="rt">${t("total_km")}</th>
      <th class="rt">${t("h_avg_km")}</th><th class="rt">${t("h_cost")}</th>
      <th>${t("h_last_trip")}</th><th>${t("driver")}</th><th></th></tr></thead><tbody>
    ${vehRows.map(v=>`<tr>
      <td><b>${esc(v.vehicle)}</b>${v.projects?`<div class="muted" style="font-size:11.5px">${esc(v.projects)}</div>`:""}</td>
      <td class="rt">${v.trips}</td><td class="rt"><b>${v.km}</b></td><td class="rt">${v.avgKm}</td>
      <td class="rt">${v.cost?("₹"+v.cost.toLocaleString("en-IN")):"—"}</td>
      <td style="white-space:nowrap">${v.last?fmtD(v.last):"—"}${v.lastOdo?`<div class="muted" style="font-size:11.5px">odo ${esc(v.lastOdo)}</div>`:""}</td>
      <td>${esc(v.drivers)||"—"}</td>
      <td><button class="btn ghost sm" onclick='vehicleReport(${JSON.stringify(String(v.vehicle))})'>${t("view_report")}</button></td>
    </tr>`).join("")}
    </tbody><tfoot><tr>
      <td><b>${t("f_total")}</b></td><td class="rt"><b>${totTr}</b></td><td class="rt"><b>${Math.round(totKm*100)/100}</b></td>
      <td class="rt">—</td><td class="rt"><b>${totCost?("₹"+totCost.toLocaleString("en-IN")):"—"}</b></td>
      <td colspan="3"></td></tr></tfoot></table></div>`
    : `<p class="muted" style="font-size:12.5px;margin:0 0 16px">${t("vw_none")}</p>`;
  return `<p class="muted" style="font-size:12.5px;margin:0 0 10px">Total km run per vehicle. Only trips closed with both a start and end reading are counted — the same basis as the monthly report emailed to admins.</p>
  <div class="row" style="margin-bottom:14px">${cards}</div>
  ${repBar(K,{dateLabel:t("dl_trips"), vehicles:uniqSorted(km,x=>x.vehicle), people:uniqSorted(km,x=>x.driver)})}
  ${repActive(K)?`<div class="row" style="margin-bottom:12px"><div class="stat g"><div class="n">${rangeKm}</div><div class="l">${t("km_selected")}</div></div>
    <div class="stat i"><div class="n">${rows.length}</div><div class="l">${t("trips_count")}</div></div>
    ${rangeCost?`<div class="stat a"><div class="n">₹${Math.round(rangeCost).toLocaleString("en-IN")}</div><div class="l">${t("h_cost")}</div></div>`:""}</div>`:""}
  ${repCount(K,rows.length,km.length)}
  <div class="vw-head">
    <h3>${t("vw_summary")}</h3>
    ${(AUTH.user.admin||AUTH.user.superAdmin)&&vehRows.length?`
      <span class="repspace"></span>
      <button class="btn ghost sm" onclick="exportCSV('${VK}')" title="${t("opens_excel")}">⤓ ${t("f_excel")}</button>
      <button class="btn ghost sm" onclick="exportPDF('${VK}')" title="${t("print_save_pdf")}">🖨 ${t("f_pdf")}</button>`:""}
  </div>
  ${vehTable}
